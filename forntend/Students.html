
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students | Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="top-header">
        <div class="logo-section">
            <span>🎓</span>
            <h2>Student Management System</h2>
        </div>

        <div class="profile">
            <div class="profile-icon">A</div>
            <span>Admin</span>
            <div class="arrow"></div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="side-bar">
        <a href="index.html" class="nav-item">🏠 Dashboard</a>
        <a href="Students.html" class="nav-item active">👨‍🎓 Students</a>
        <a href="subjects.html" class="nav-item">📚 Subjects</a>
        <a href="performance.html" class="nav-item">📝 Performance</a>
        <a href="settings.html" class="nav-item">⚙️ Settings</a>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Page Heading -->
        <section class="s1">
            <div>
                <h2>👨‍🎓 Students</h2>
                <p>Manage student records and information.</p>
            </div>

            <button type="button" class="add-student" id="add-student">
                <span>+</span> Add Student
            </button>
        </section>

        <!-- Search and Filter -->
        <section class="student-filters">
            <div class="search-box">
                <span>🔍</span>
                <input
                    type="text"
                    id="search-student"
                    placeholder="Search students..."
                >
            </div>

            <div class="class-filter">
                <label for="filter-class">Class:</label>
                <select id="filter-class">
                    <option value="">All Classes</option>
                    <option value="BCA 1st Year">BCA 1st Year</option>
                    <option value="BCA 2nd Year">BCA 2nd Year</option>
                    <option value="BCA 3rd Year">BCA 3rd Year</option>
                </select>
            </div>
        </section>

        <!-- Students Table -->
        <section class="student-table">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Roll No.</th>
                        <th>Class</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">
                    <!-- Student records will be loaded by JavaScript -->
                </tbody>
            </table>
        </section>

    </main>

    <!-- Add Student Modal -->
    <div class="student-modal" id="student-modal">
        <div class="student-modal-content">

            <div class="modal-header">
                <h2>Add Student</h2>
                <button
                    type="button"
                    class="close-modal"
                    id="close-modal"
                    aria-label="Close"
                >&times;</button>
            </div>

            <form id="student-form">
                <div class="form-group">
                    <label for="student-name">Full Name</label>
                    <input
                        type="text"
                        id="student-name"
                        name="name"
                        placeholder="Enter student name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="roll-number">Roll Number</label>
                    <input
                        type="number"
                        id="roll-number"
                        name="rollno"
                        placeholder="Enter roll number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="student-class">Class</label>
                    <input
                        type="text"
                        id="student-class"
                        name="class"
                        placeholder="Enter class"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="student-email">Email</label>
                    <input
                        type="email"
                        id="student-email"
                        name="email"
                        placeholder="Enter email address"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="student-phone">Phone Number</label>
                    <input
                        type="tel"
                        id="student-phone"
                        name="phone"
                        placeholder="Enter phone number"
                        required
                    >
                </div>

                <div class="modal-actions">
                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancel-modal"
                    >Cancel</button>

                    <button type="submit" class="save-btn">
                        Save Student
                    </button>
                </div>
            </form>

        </div>
    </div>

    <!-- Edit Student Modal -->
    <div class="student-modal" id="edit-student-modal">
        <div class="student-modal-content">

            <div class="modal-header">
                <h2>Edit Student</h2>
                <button
                    type="button"
                    class="close-modal"
                    id="close-edit-modal"
                    aria-label="Close"
                >&times;</button>
            </div>

            <form id="edit-student-form">
                <div class="form-group">
                    <label for="edit-student-name">Full Name</label>
                    <input
                        type="text"
                        id="edit-student-name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="edit-roll-number">Roll Number</label>
                    <input
                        type="text"
                        id="edit-roll-number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="edit-student-class">Class</label>
                    <input
                        type="text"
                        id="edit-student-class"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="edit-student-email">Email</label>
                    <input
                        type="email"
                        id="edit-student-email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="edit-student-phone">Phone Number</label>
                    <input
                        type="tel"
                        id="edit-student-phone"
                        required
                    >
                </div>

                <div class="modal-actions">
                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancel-edit-modal"
                    >Cancel</button>

                    <button type="submit" class="save-btn">
                        Save Changes
                    </button>
                </div>
            </form>

        </div>
    </div>
    <script src="student.js"></script>
</body>
</html>
