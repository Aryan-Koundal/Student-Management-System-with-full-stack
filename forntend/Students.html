<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Marks</title>
</head>
<body>
    <header class="top-header">
        <div class="logo-section">
            <span>🎓</span>
            <h2>Student Management System</h2>
        </div>

        <div class="profile">
            <div class="profile-icon">👤</div>
            <span>Admin</span>
            <span class="arrow"></span>
        </div>
    </header>

    <aside class="side-bar">
        <nav class="navigation">
            <a href="index.html" class="nav-item">🏠 Dashboard</a>
            <a href="Students.html" class="nav-item">👥 Students</a>
            <a href="subjects.html" class="nav-item">📚 Subject</a>
            <a href="marks.html" class="nav-item">📝 Performance</a>
            <a href="settings.html" class="nav-item settings-item">⚙️ Settings</a>
        </nav>
    </aside>

    <main class="main-content">

        <!-- Header -->
        <div class="s1">
            <div>
                <h2>Performance</h2>
                <p>Manage and View all Student performance in system</p>
            </div>

            <button type="button" class="add-marks" id="add-marks">
                <span>+</span>
                Add student marks
            </button>
        </div>

        <!-- Marks Modal -->
        <div class="marks-modal" id="marks-modal">
            <div class="marks-modal-content">

                <div class="header-modal">
                    <h2 class="modal-header">Add Marks</h2>
                    <button type="button" class="close-modal" id="close-modal">
                        &times;
                    </button>
                </div>

                <form class="makrs-form" id="makrs-form">

                    <div class="form-group">
                        <label for="student-id">Student Id</label>
                        <input
                            type="number"
                            id="student-id"
                            name="student-id"
                            placeholder="Enter student id"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="subject-id">Subject Id</label>
                        <input
                            type="number"
                            id="subject-id"
                            name="subject-id"
                            placeholder="Enter subject id"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="subject-marks">Marks</label>
                        <input
                            type="number"
                            id="subject-marks"
                            name="subject-marks"
                            placeholder="Enter subject marks"
                            min="0"
                            required
                        >
                    </div>

                    <div>
                        <button type="button" class="add-subject1" id="add-subject1">
                            <span>+</span>
                            Add subject
                        </button>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="save-marks" id="save-marks">
                            Save Marks
                        </button>

                        <button type="button" class="cancel-marks" id="cancel-marks">
                            Cancel
                        </button>
                    </div>

                </form>
            </div>
        </div>

        <!-- Student marks cards will appear here -->
        <div class="marks-container" id="marks-container">
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
